<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharma Lead Finder</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root {
    --navy: #071828;
    --navy-2: #0c2c4c;
    --navy-3: #123a62;
    --ink: #10233a;
    --blue: #1d6bc4;
    --blue-2: #2b7de9;
    --blue-soft: #e8f1fb;
    --bg: #e8eef5;
    --card: #fff;
    --muted: #5b7088;
    --line: #d5e0ea;
    --ok: #1a7f4c;
    --warn: #9a6b00;
    --bad: #8a3b3b;
    --soon: #5b7088;
    --gold: #d4a017;
    --gold-2: #f5c84c;
    --mark: #fff1a8;
    --shadow: 0 10px 30px -18px rgba(7,24,40,.45), 0 1px 3px rgba(7,24,40,.06);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    background:
      radial-gradient(900px 280px at 85% -10%, rgba(43,125,233,.28), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: calc(18px + var(--safe-t)) 20px 48px;
    box-shadow: 0 8px 24px rgba(7,24,40,.28);
  }
  .head { max-width: 1180px; margin: 0 auto; display: flex; gap: 18px; align-items: center; }
  .head img {
    height: 56px; width: auto; max-width: min(280px, 70vw);
    object-fit: contain; object-position: left center;
    background: #fff; border-radius: 12px; padding: 8px 12px;
    display: block; flex: 0 0 auto;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .head h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.02em; font-weight: 800; }
  .head p { margin: 4px 0 0; font-size: .86rem; color: #c9d8ea; line-height: 1.35; }
  @media (max-width: 560px) {
    .head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .head img { height: 48px; max-width: min(260px, 86vw); padding: 6px 10px; }
    .head h1 { font-size: 1.28rem; }
  }
  .stats {
    max-width: 1180px; margin: -32px auto 0; padding: 0 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    position: relative; z-index: 3;
  }
  @media (min-width: 860px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat-tile {
    background: var(--card); border-radius: 16px; padding: 14px 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.7);
    min-height: 86px;
  }
  .stat-tile .k {
    font-size: .68rem; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .stat-tile .n {
    display: block; font-size: 1.45rem; font-weight: 800;
    color: var(--navy-2); margin-top: 6px; letter-spacing: -.03em; line-height: 1.15;
  }
  .stat-tile .n.small { font-size: .98rem; font-weight: 700; letter-spacing: 0; }
  nav {
    max-width: 1180px; margin: 14px auto 0; padding: 0 16px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  nav button {
    border: 0; background: #fff; color: var(--navy-2); font-weight: 700;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(16,40,70,.08); font-size: .95rem;
    min-height: 44px; transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  nav button.active { background: var(--blue); color: #fff; box-shadow: 0 6px 16px -8px rgba(29,107,196,.8); }
  @media (hover:hover) { nav button:hover { transform: translateY(-1px); } }

  /* Sticky search + filter bar */
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 82%, rgba(232,238,245,0));
    padding: 12px 16px 10px;
    max-width: 1180px; margin: 0 auto;
  }
  .searchrow { display: flex; gap: 8px; align-items: stretch; }
  .searchbox {
    flex: 1 1 auto; display: flex; align-items: center; gap: 8px;
    background: #fff; border: 2px solid var(--blue); border-radius: 14px;
    padding: 0 6px 0 14px; min-height: 52px;
    box-shadow: 0 8px 20px -12px rgba(29,107,196,.55);
  }
  .searchbox svg { width: 20px; height: 20px; color: var(--blue); flex: 0 0 auto; }
  .searchbox input {
    flex: 1 1 auto; border: 0; outline: none; font-size: 1.05rem; color: var(--ink);
    background: transparent; min-width: 0; padding: 12px 0;
  }
  .searchbox input::placeholder { color: #8aa0b5; }
  .xbtn {
    border: 0; background: var(--blue-soft); color: var(--navy-2);
    width: 36px; height: 36px; border-radius: 999px; cursor: pointer;
    font-size: 1rem; font-weight: 800; line-height: 1; flex: 0 0 auto;
  }
  .xbtn[hidden] { display: none; }
  .chiprow {
    display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .fchip {
    border: 1px solid var(--line); background: #fff; color: var(--navy-2);
    font: 700 .8rem/1 "Segoe UI", system-ui, sans-serif; white-space: nowrap;
    padding: 9px 12px; border-radius: 999px; cursor: pointer; min-height: 38px;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .fchip small { color: var(--muted); font-weight: 700; }
  .fchip.on { background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
  .fchip.on small { color: #bcd2ea; }
  .fchip.tgl.on { background: var(--blue); border-color: var(--blue); }
  .selrow { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .selrow label {
    flex: 1 1 150px; display: flex; flex-direction: column; gap: 4px;
    font-size: .66rem; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
  }
  .selrow select {
    min-height: 44px; border: 1px solid var(--line); border-radius: 12px;
    padding: 0 10px; font-size: .95rem; background: #fff; color: var(--ink);
    text-transform: none; letter-spacing: 0; font-weight: 600;
  }
  .clearbtn {
    border: 0; background: transparent; color: var(--blue); font-weight: 800;
    cursor: pointer; font-size: .85rem; padding: 6px 4px;
  }
  .clearbtn[hidden] { display: none; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 4px 16px calc(40px + var(--safe-b)); }
  .meta { color: var(--muted); font-size: .9rem; margin: 2px 0 14px; }
  .meta b { color: var(--navy-2); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    position: relative; overflow: hidden;
    background: var(--card); border-radius: 18px; padding: 18px 18px 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(16,40,70,.06);
    transition: box-shadow .2s ease;
  }
  .card h2 { margin: 0 8px 0 0; font-size: 1.1rem; letter-spacing: -.01em; }
  .card.hot {
    border-color: #f0c14b;
    background: linear-gradient(180deg, #fffaf0 0%, #fff 42%);
    box-shadow: 0 12px 28px -16px rgba(180,120,0,.35), 0 1px 3px rgba(16,40,70,.06);
  }
  .card.hot::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold));
    border-radius: 18px 0 0 18px;
  }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .badge {
    font-size: .7rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; background: var(--blue-soft); color: var(--blue);
    border: 0; cursor: pointer; font-family: inherit;
  }
  button.badge:active { transform: scale(.97); }
  .badge.low { background: #fff3cd; color: #8a6500; cursor: default; }
  .badge.prod { background: #eee8ff; color: #5b3db8; cursor: default; }
  .badge.hot { background: #fff1c2; color: #8a5a00; cursor: default; }
  .stat { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 8px; font-size: .95rem; }
  .stat b { font-variant-numeric: tabular-nums; }
  .contact-line { font-size: .93rem; margin: 0 0 4px; color: var(--ink); }
  .contact-line span { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .act {
    display: inline-flex; align-items: center; gap: 6px; min-height: 42px;
    padding: 0 14px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: .9rem;
    border: 1px solid var(--line); background: #f7fafc; color: var(--navy-2);
    transition: background .15s ease, transform .15s ease;
  }
  .act svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .act.call { background: #e8f8ef; border-color: #bfe8d1; color: #14663c; }
  .act.mail { background: #fdf3e3; border-color: #f0dcb4; color: #7a5200; }
  .act.map { background: var(--blue-soft); border-color: #c9def5; color: var(--blue); }
  @media (hover:hover) { .act:hover { transform: translateY(-1px); } }

  .perm-toggle {
    width: 100%; margin-top: 12px; border: 1px solid var(--line); background: #f7fafc;
    color: var(--navy-2); font-weight: 800; font-size: .9rem; cursor: pointer;
    border-radius: 12px; min-height: 44px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .perm-toggle .chev { transition: transform .2s ease; color: var(--muted); }
  .perm-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .perm-list { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .prow {
    display: grid; grid-template-columns: 86px 1fr auto; gap: 10px; align-items: baseline;
    padding: 9px 12px; background: #fff; border-top: 1px solid #eef2f6; font-size: .88rem;
  }
  .prow:first-child { border-top: 0; }
  .prow.hit { background: #fffbe8; }
  .prow .d { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prow .a { line-height: 1.35; }
  .prow .a small { display: block; color: var(--muted); }
  .prow .no { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem; color: var(--navy-3); white-space: nowrap; }
  @media (max-width: 480px) {
    .prow { grid-template-columns: 74px 1fr; }
    .prow .no { grid-column: 2; }
  }
  .showall {
    width: 100%; border: 0; border-top: 1px solid #eef2f6; background: #f7fafc;
    color: var(--blue); font-weight: 800; font-size: .86rem; cursor: pointer;
    min-height: 42px; padding: 10px;
  }

  .flat-list { display: flex; flex-direction: column; gap: 8px; }
  .frow {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; align-items: baseline;
    background: #fff; border-radius: 14px; padding: 12px 14px;
    box-shadow: var(--shadow); border: 1px solid rgba(16,40,70,.05); font-size: .92rem;
  }
  .frow .d { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .frow .who { font-weight: 800; color: var(--navy-2); }
  .frow button.who {
    border: 0; background: none; padding: 0; font: inherit; font-weight: 800;
    color: var(--blue); cursor: pointer; text-align: left;
  }
  .frow .a { color: var(--ink); }
  .frow .a small { display: block; color: var(--muted); }
  .frow .no { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem; color: var(--navy-3); white-space: nowrap; }
  @media (max-width: 560px) {
    .frow { grid-template-columns: 76px 1fr; }
    .frow .no { grid-column: 2; }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
  .chip {
    border: 1px solid var(--line); background: #f7fafc; color: var(--muted);
    font: 700 .75rem/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .02em;
    padding: 8px 10px; border-radius: 999px; cursor: pointer; min-height: 36px;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.on { background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
  .chip.on.New { background: var(--blue); border-color: var(--blue); }
  .chip.on.Called { background: #155e8a; border-color: #155e8a; }
  .chip.on.Interested { background: var(--ok); border-color: var(--ok); }
  .chip.on.Won { background: #0f6b3c; border-color: #0f6b3c; }
  .chip[data-st="Not interested"].on { background: #6b7280; border-color: #6b7280; }
  .notes {
    width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font: inherit; color: var(--ink); background: #fbfcfe; resize: vertical;
  }
  .empty {
    background: #fff; border-radius: 18px; padding: 32px 18px; text-align: center;
    color: var(--muted); box-shadow: var(--shadow);
  }
  .band {
    margin: 18px 0 8px; font-size: .72rem; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .county-list { display: flex; flex-direction: column; gap: 10px; }
  .county-row {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: start;
    background: #fff; border-radius: 16px; padding: 14px 14px;
    box-shadow: var(--shadow); border: 1px solid rgba(16,40,70,.05);
  }
  @media (max-width: 620px) {
    .county-row { grid-template-columns: 64px 1fr; }
    .county-row .cright { grid-column: 2; }
  }
  .dist {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #e8eef6; color: var(--navy-2); font-weight: 800;
  }
  .dist b { font-size: 1.15rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .dist span { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
  .dist.d0 { background: #0c2c4c; color: #fff; }
  .dist.d1 { background: #1d6bc4; color: #fff; }
  .dist.d2 { background: #3d6f99; color: #fff; }
  .dist.d3 { background: #fff1c2; color: #8a6500; }
  .cinfo h3 { margin: 0 0 2px; font-size: 1rem; }
  .hint { color: var(--muted); font-size: .82rem; }
  .hint a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .cright { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 800; padding: 4px 8px; border-radius: 999px; }
  .pill.live { background: #d9f3e5; color: var(--ok); }
  .pill.coming_soon { background: #eef2f5; color: var(--soon); }
  .pill.needs_browser { background: #fff3cd; color: var(--warn); }
  .pill.failed { background: #fde8e8; color: var(--bad); }
  .see-builders {
    border: 0; background: var(--blue); color: #fff; font-weight: 800; font-size: .82rem;
    border-radius: 999px; padding: 9px 14px; cursor: pointer; min-height: 38px;
  }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 8px 16px calc(28px + var(--safe-b)); }
  .err { background: #fde8e8; color: var(--bad); padding: 10px 12px; border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .act, .chip, .fchip, .perm-toggle .chev { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <img src="logo.png" alt="Sharma Electric &amp; HVAC" onerror="this.style.display='none'">
    <div>
      <h1>Sharma Lead Finder</h1>
      <p>Builders pulling new-home permits — search by builder, address, city, permit # or phone</p>
    </div>
  </div>
</header>
<div class="stats" id="stats" hidden></div>
<nav id="viewnav">
  <button type="button" data-view="builders" class="active">Builders</button>
  <button type="button" data-view="permits">Latest permits</button>
  <button type="button" data-view="counties">Counties</button>
</nav>

<div class="controls" id="controls">
  <div class="searchrow">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search builder, address, city, permit #, phone…">
      <button type="button" class="xbtn" id="qclear" hidden aria-label="Clear search">×</button>
    </div>
  </div>
  <div class="chiprow" id="countychips" aria-label="Filter by area"></div>
  <div class="chiprow" id="typechips" aria-label="Filter by type and contact info">
    <button type="button" class="fchip tgl" data-type="all">All builders</button>
    <button type="button" class="fchip tgl" data-type="custom">Custom</button>
    <button type="button" class="fchip tgl" data-type="production">Production</button>
    <button type="button" class="fchip tgl" data-has="phone">Has phone</button>
    <button type="button" class="fchip tgl" data-has="email">Has email</button>
    <button type="button" class="fchip tgl" data-has="website">Has website</button>
  </div>
  <div class="selrow">
    <label>Sort
      <select id="sort">
        <option value="recent">Most recent first</option>
        <option value="permits">Most permits</option>
        <option value="name">Name A–Z</option>
      </select>
    </label>
    <label>Status
      <select id="statusf">
        <option value="">All statuses</option>
      </select>
    </label>
  </div>
  <button type="button" class="clearbtn" id="clearall" hidden>Clear all filters ×</button>
</div>

<div class="wrap" id="app"><p class="meta">Loading…</p></div>
<footer>Sharma Electric &amp; HVAC · Lic. EC13013924 · CAC1823596</footer>
<script>
const STATUSES = ["New","Called","Interested","Not interested","Won"];
const HOT_MIN = 8;
const PERMITS_PREVIEW = 6;
const FLAT_LIMIT = 200;
const MILES_BASIS = "Distances are statute miles from downtown Orlando (28.5383°N, 81.3792°W) to each county seat. City of Orlando is 0.";
let DATA = null;
let VIEW = "builders";
let q = "", countySel = "", statusF = "", sortBy = "recent", typeF = "all";
let hasF = { phone: false, email: false, website: false };
const EXPANDED = new Set(), COLLAPSED = new Set(), SHOWALL = new Set();
let RECS = new Map(), BHAY = new Map(), MATCHED = new Map();

const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const statsEl = $("#stats");

/* Same name normalisation the collector uses, so records join to builders exactly. */
function cleanName(raw){
  if(!raw) return "";
  return String(raw).replace(/\s+/g," ").replace(/,?\s*d\/b\/a\s+/i," ").trim();
}
function normName(raw){
  return cleanName(raw).toLowerCase().replace(/[.,'"()]/g," ")
    .replace(/\b(llc|l l c|inc|incorporated|corp|corporation|co|ltd|limited|company|companies|the)\b/g," ")
    .replace(/\s+/g," ").trim();
}
function slugId(raw){
  const n = normName(raw) || cleanName(raw).toLowerCase();
  return n.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80) || "unknown";
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if(!d) return "—";
  const [y,m,day] = String(d).split("-");
  if(!day) return esc(d);
  return `${m}/${day}/${y}`;
}
function fmtEt(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return esc(String(iso));
  return d.toLocaleString("en-US", {
    timeZone: "America/New_York", month: "numeric", day: "numeric", year: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  }) + " ET";
}
function digits(s){ return String(s||"").replace(/\D/g,""); }
function telHref(phone){ const d = digits(phone); return d ? "tel:" + d : ""; }
function mapHref(addr){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr); }
function iconPhone(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
}
function iconMap(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
}
function iconWeb(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>';
}
function iconMail(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>';
}

function tokens(){
  return q.toLowerCase().split(/\s+/).filter(t => t.length > 0);
}
function hl(text){
  const t = String(text ?? "");
  const toks = tokens().filter(x => x.length >= 2);
  if(!toks.length) return esc(t);
  let out = esc(t);
  for(const tok of toks){
    const pat = tok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try { out = out.replace(new RegExp("(" + pat + ")", "gi"), "<mark>$1</mark>"); } catch(e){}
  }
  return out;
}
function recHay(r){
  if(r._h == null){
    r._h = (cleanName(r.builder) + " " + (r.address||"") + " " + (r.permitNo||"") + " " + (r.county||"") + " " + digits(r.phone)).toLowerCase();
  }
  return r._h;
}
function tokenHits(text, t){
  if(text.includes(t)) return true;
  const d = digits(t);
  return d.length >= 3 && digits(text).includes(d);
}
function builderHay(b){
  if(!BHAY.has(b.id)){
    BHAY.set(b.id, (b.name + " " + (b.contactName||"") + " " + (b.email||"") + " " + (b.website||"") + " " + (b.phone||"") + " " + digits(b.phone) + " " + (b.counties||[]).join(" ")).toLowerCase());
  }
  return BHAY.get(b.id);
}
function matchedRecs(b){
  const toks = tokens();
  if(!toks.length) return null;
  const recs = RECS.get(b.id) || [];
  const hits = new Set();
  recs.forEach((r, i) => { if(toks.some(t => tokenHits(recHay(r), t))) hits.add(i); });
  return hits;
}

async function load(){
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if(!r.ok) throw new Error("HTTP "+r.status);
    DATA = await r.json();
    try {
      const saved = JSON.parse(localStorage.getItem("lead-status") || "{}");
      (DATA.builders||[]).forEach(b => {
        if(saved[b.id]){ b.status = saved[b.id].status || b.status; b.notes = saved[b.id].notes ?? b.notes; }
      });
    } catch(e){}
    RECS = new Map();
    for(const rec of (DATA.records||[])){
      const id = slugId(rec.builder);
      if(!RECS.has(id)) RECS.set(id, []);
      RECS.get(id).push(rec);
    }
    for(const list of RECS.values()){
      list.sort((a,b) => String(b.date||"") < String(a.date||"") ? -1 : String(b.date||"") > String(a.date||"") ? 1 : 0);
    }
    buildCountyChips();
    buildStatusOptions();
    renderStats();
    syncControls();
    render();
  } catch(e){
    app.innerHTML = '<p class="err">Could not load leads. '+esc(e.message)+'</p>';
  }
}

function countyCounts(){
  const m = new Map();
  for(const b of (DATA.builders||[])){
    for(const c of (b.counties||[])){
      m.set(c, (m.get(c)||0) + (RECS.get(b.id)||[]).filter(r => r.county === c).length);
    }
  }
  return [...m.entries()].filter(([,n]) => n > 0).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}
function buildCountyChips(){
  const chips = ['<button type="button" class="fchip" data-county="">All areas</button>']
    .concat(countyCounts().map(([name,n]) =>
      `<button type="button" class="fchip" data-county="${esc(name)}">${esc(name)} <small>${n}</small></button>`));
  $("#countychips").innerHTML = chips.join("");
}
function buildStatusOptions(){
  $("#statusf").innerHTML = '<option value="">All statuses</option>' +
    STATUSES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
}
function liveCountyCount(){
  return (DATA.counties||[]).filter(c => c.status==="live").length;
}
function renderStats(){
  if(!DATA){ statsEl.hidden = true; return; }
  const total = (DATA.builders||[]).length;
  const permits = (DATA.stats && DATA.stats.permits) || (DATA.records||[]).length;
  statsEl.hidden = false;
  statsEl.innerHTML = `
    <div class="stat-tile"><span class="k">Builders</span><span class="n">${total}</span></div>
    <div class="stat-tile"><span class="k">Permits</span><span class="n">${permits}</span></div>
    <div class="stat-tile"><span class="k">Live counties</span><span class="n">${liveCountyCount()}</span></div>
    <div class="stat-tile"><span class="k">Last scan</span><span class="n small">${esc(fmtEt(DATA.fetchedAt))}</span></div>`;
}

function filtersActive(){
  return !!(q || countySel || statusF || typeF !== "all" || hasF.phone || hasF.email || hasF.website);
}
function syncControls(){
  $("#q").value = q;
  $("#qclear").hidden = !q;
  $("#clearall").hidden = !filtersActive();
  document.querySelectorAll("#countychips .fchip").forEach(ch =>
    ch.classList.toggle("on", (ch.dataset.county || "") === countySel));
  document.querySelectorAll("#typechips .fchip").forEach(ch => {
    if(ch.dataset.type) ch.classList.toggle("on", ch.dataset.type === typeF);
    if(ch.dataset.has) ch.classList.toggle("on", !!hasF[ch.dataset.has]);
  });
  $("#sort").value = sortBy;
  $("#statusf").value = statusF;
  document.querySelectorAll("#viewnav button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === VIEW));
}

function builderPasses(b, ignoreCounty){
  if(typeF === "custom" && b.production) return false;
  if(typeF === "production" && !b.production) return false;
  if(!ignoreCounty && countySel && !(b.counties||[]).includes(countySel)) return false;
  if(statusF && b.status !== statusF) return false;
  if(hasF.phone && !b.phone) return false;
  if(hasF.email && !b.email) return false;
  if(hasF.website && !b.website) return false;
  const toks = tokens();
  if(toks.length){
    const hay = builderHay(b);
    const recs = RECS.get(b.id) || [];
    for(const t of toks){
      if(tokenHits(hay, t)) continue;
      if(recs.some(r => tokenHits(recHay(r), t))) continue;
      return false;
    }
  }
  return true;
}
function filteredBuilders(){
  const list = (DATA.builders||[]).filter(b => builderPasses(b, false));
  if(sortBy === "permits") list.sort((a,b) => (b.permitCount||0)-(a.permitCount||0) || String(b.latestDate||"").localeCompare(String(a.latestDate||"")));
  else if(sortBy === "name") list.sort((a,b) => a.name.localeCompare(b.name));
  else list.sort((a,b) => String(b.latestDate||"").localeCompare(String(a.latestDate||"")) || (b.permitCount||0)-(a.permitCount||0));
  return list;
}

function permitRow(r, hits, idx){
  const hit = hits && hits.has(idx) ? ' class="prow hit"' : ' class="prow"';
  return `<div${hit}>
    <span class="d">${fmtDate(r.date)}</span>
    <span class="a">${hl(r.address || "—")}<small>${esc(r.county || "")}</small></span>
    <span class="no">${hl(r.permitNo || "")}</span>
  </div>`;
}
function card(b){
  const hot = (b.permitCount||0) >= HOT_MIN;
  const recs = RECS.get(b.id) || [];
  const hits = MATCHED.get(b.id) || null;
  const autoOpen = !!(hits && hits.size);
  const open = !COLLAPSED.has(b.id) && (EXPANDED.has(b.id) || autoOpen);
  const showAll = SHOWALL.has(b.id);
  const shown = showAll ? recs : recs.slice(0, PERMITS_PREVIEW);
  const badges = (b.counties||[]).map(c=>`<button type="button" class="badge" data-act="county" data-county="${esc(c)}">${esc(c)}</button>`).join("")
    + (hot?`<span class="badge hot">Hot lead</span>`:"")
    + (b.lowPriority?`<span class="badge low">Low priority</span>`:"")
    + (b.production?`<span class="badge prod">Production</span>`:`<span class="badge">Custom</span>`);
  const acts = [];
  if(b.phone && telHref(b.phone)) acts.push(`<a class="act call" href="${esc(telHref(b.phone))}">${iconPhone()} ${esc(b.phone)}</a>`);
  if(b.email) acts.push(`<a class="act mail" href="mailto:${esc(b.email)}">${iconMail()} Email</a>`);
  if(b.website) acts.push(`<a class="act map" href="${esc(b.website)}" target="_blank" rel="noopener">${iconWeb()} Website</a>`);
  if(b.addresses && b.addresses[0]) acts.push(`<a class="act map" href="${esc(mapHref(b.addresses[0]))}" target="_blank" rel="noopener">${iconMap()} Map</a>`);
  const contact = b.contactName ? `<p class="contact-line">Contact: <b>${hl(b.contactName)}</b>${b.contactTitle?` <span>— ${esc(b.contactTitle)}</span>`:""}</p>` : "";
  const chips = STATUSES.map(s=>{
    const cls = s==="Not interested" ? "chip" : "chip "+s.replace(/\s+/g,"");
    return `<button type="button" class="${cls}${s===b.status?" on":""}" data-st="${esc(s)}">${esc(s)}</button>`;
  }).join("");
  const permBlock = recs.length ? `
    <button type="button" class="perm-toggle" data-act="toggle-permits" aria-expanded="${open}">
      <span>Permits (${recs.length})${autoOpen && hits ? ` · ${hits.size} match${hits.size===1?"":"es"}` : ""}</span>
      <span class="chev">▾</span>
    </button>
    ${open ? `<div class="perm-list">${shown.map((r) => permitRow(r, hits, recs.indexOf(r))).join("")}${!showAll && recs.length > PERMITS_PREVIEW ? `<button type="button" class="showall" data-act="show-all">Show all ${recs.length} permits</button>` : ""}</div>` : ""}` : "";
  return `<article class="card${hot?" hot":""}" data-id="${esc(b.id)}">
    <h2>${hl(b.name)}</h2>
    <div class="badges">${badges}</div>
    <div class="stat"><span><b>${b.permitCount}</b> recent permit${b.permitCount===1?"":"s"}</span>
      <span>Latest ${fmtDate(b.latestDate)}</span></div>
    ${contact}
    ${acts.length?`<div class="actions">${acts.join("")}</div>`:""}
    ${permBlock}
    <div class="chips">${chips}</div>
    <textarea class="notes" placeholder="Notes">${esc(b.notes||"")}</textarea>
  </article>`;
}

function renderBuilders(){
  MATCHED = new Map();
  const list = filteredBuilders();
  for(const b of list){ const m = matchedRecs(b); if(m) MATCHED.set(b.id, m); }
  const permitsShown = list.reduce((n,b) => n + (b.permitCount||0), 0);
  const meta = `<p class="meta">Showing <b>${list.length}</b> builder${list.length===1?"":"s"} · <b>${permitsShown}</b> permits${countySel?` in <b>${esc(countySel)}</b>`:""}${q?` matching “${esc(q)}”`:""}</p>`;
  if(!list.length){
    app.innerHTML = meta + '<div class="empty">No builders match. Try a shorter search — a street name, a city, or part of a permit number — or clear the filters above.</div>';
    return;
  }
  app.innerHTML = meta + `<div class="grid">${list.map(card).join("")}</div>`;
}

function renderPermits(){
  const toks = tokens();
  let rows = (DATA.records||[]).slice();
  if(countySel) rows = rows.filter(r => r.county === countySel);
  if(toks.length){
    rows = rows.filter(r => {
      const nameHay = (cleanName(r.builder) + " " + digits(r.phone)).toLowerCase();
      return toks.every(t => tokenHits(recHay(r), t) || tokenHits(nameHay, t));
    });
  }
  rows.sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
  const total = rows.length;
  rows = rows.slice(0, FLAT_LIMIT);
  const meta = `<p class="meta">Showing <b>${rows.length}</b> of <b>${total}</b> permits, newest first${countySel?` in <b>${esc(countySel)}</b>`:""}${q?` matching “${esc(q)}”`:""}. Tap a builder name to open its card.</p>`;
  if(!rows.length){
    app.innerHTML = meta + '<div class="empty">No permits match. Try clearing the filters above.</div>';
    return;
  }
  app.innerHTML = meta + `<div class="flat-list">${rows.map(r => `
    <div class="frow">
      <span class="d">${fmtDate(r.date)}</span>
      <span class="a"><button type="button" class="who" data-act="jump-builder" data-name="${esc(cleanName(r.builder))}">${hl(cleanName(r.builder))}</button>
      <small>${hl(r.address || "—")} · ${esc(r.county || "")}</small></span>
      <span class="no">${hl(r.permitNo || "")}</span>
    </div>`).join("")}</div>`;
}

function distClass(m){
  if(m==null) return "d2";
  if(m <= 50) return "d0";
  if(m <= 100) return "d1";
  if(m <= 150) return "d2";
  return "d3";
}
function bandLabel(m){
  if(m==null) return "Other";
  if(m <= 50) return "Within 50 miles";
  if(m <= 100) return "50–100 miles";
  if(m <= 150) return "100–150 miles";
  return "Always included (beyond 150 miles)";
}
function pills(s){
  const label = s==="needs_browser" ? "Needs browser" : s==="coming_soon" ? "Coming soon" : s==="failed" ? "Failed last run" : s==="live" ? "Live" : s;
  return `<span class="pill ${esc(s)}">${esc(label)}</span>`;
}
function renderCounties(){
  const chipNames = new Set(countyCounts().map(([n]) => n));
  const rows = (DATA.counties||[]).slice().sort((a,b)=>{
    const ma = a.miles ?? 9999, mb = b.miles ?? 9999;
    if(ma !== mb) return ma - mb;
    if(a.kind==="city" && b.kind!=="city") return -1;
    if(b.kind==="city" && a.kind!=="city") return 1;
    return a.name.localeCompare(b.name);
  }).filter(c => {
    if(q && !((c.name+" "+(c.vendor||"")+" "+(c.status||"")+" "+(c.seat||"")).toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  });
  const groups = [];
  for(const c of rows){
    const label = bandLabel(c.miles);
    if(!groups.length || groups[groups.length-1].label !== label) groups.push({label, rows:[]});
    groups[groups.length-1].rows.push(c);
  }
  const body = groups.map(g => {
    const items = g.rows.map(c => {
      const mi = c.miles==null ? "—" : String(c.miles);
      const seat = c.seat ? `Seat: ${esc(c.seat)}` : "";
      const vendor = c.portal
        ? `<a href="${esc(c.portal)}" target="_blank" rel="noopener">${esc(c.vendor||"Open portal")}</a>`
        : esc(c.vendor||"");
      const bits = [seat, vendor, c.lastScan ? "Last scan "+fmtEt(c.lastScan) : "", (c.records? c.records+" record"+(c.records===1?"":"s"):""), c.lastSuccessAt && c.status!=="live" ? "Last success "+fmtEt(c.lastSuccessAt) : ""].filter(Boolean);
      const seeBtn = chipNames.has(c.name) ? `<button type="button" class="see-builders" data-act="county" data-county="${esc(c.name)}">See builders →</button>` : "";
      return `<article class="county-row">
        <div class="dist ${distClass(c.miles)}"><b>${esc(mi)}</b><span>mi</span></div>
        <div class="cinfo">
          <h3>${esc(c.name)}</h3>
          <div class="hint">${bits.join(" · ")}${c.alwaysInclude?' · Always included':''}</div>
          ${c.notes?`<div class="hint">${esc(c.notes)}</div>`:""}
          ${c.error?`<div class="hint" style="color:var(--bad)">Last run error: ${esc(c.error)}</div>`:""}
        </div>
        <div class="cright">${pills(c.status||c.configuredStatus)}${seeBtn}</div>
      </article>`;
    }).join("");
    return `<div class="band">${esc(g.label)}</div><div class="county-list">${items}</div>`;
  }).join("") || '<div class="empty">No counties match the search.</div>';
  app.innerHTML = `<p class="meta">${rows.length} area${rows.length===1?"":"s"} · Last run ${fmtEt(DATA.fetchedAt)} · ${liveCountyCount()} live · ${esc(MILES_BASIS)}</p>${body}`;
}

function render(){
  if(!DATA){ app.innerHTML = '<p class="meta">Loading…</p>'; return; }
  if(VIEW === "counties") renderCounties();
  else if(VIEW === "permits") renderPermits();
  else renderBuilders();
}
function saveLocal(id, nextStatus, nextNotes){
  const b = (DATA.builders||[]).find(x=>x.id===id);
  if(b){ b.status=nextStatus; b.notes=nextNotes; }
  try {
    const saved = JSON.parse(localStorage.getItem("lead-status") || "{}");
    saved[id] = { status: nextStatus, notes: nextNotes };
    localStorage.setItem("lead-status", JSON.stringify(saved));
  } catch(e){}
}

/* Controls wiring (bound once; results re-render separately so search never loses focus) */
document.querySelectorAll("#viewnav button").forEach(btn => {
  btn.addEventListener("click", () => { VIEW = btn.dataset.view; syncControls(); render(); window.scrollTo({ top: 0 }); });
});
$("#q").addEventListener("input", ev => { q = ev.target.value; $("#qclear").hidden = !q; $("#clearall").hidden = !filtersActive(); render(); });
$("#qclear").addEventListener("click", () => { q = ""; syncControls(); render(); $("#q").focus(); });
$("#countychips").addEventListener("click", ev => {
  const ch = ev.target.closest(".fchip"); if(!ch) return;
  countySel = ch.dataset.county || "";
  if(VIEW === "counties") VIEW = "builders";
  syncControls(); render();
});
$("#typechips").addEventListener("click", ev => {
  const ch = ev.target.closest(".fchip"); if(!ch) return;
  if(ch.dataset.type) typeF = ch.dataset.type;
  if(ch.dataset.has) hasF[ch.dataset.has] = !hasF[ch.dataset.has];
  syncControls(); render();
});
$("#sort").addEventListener("change", ev => { sortBy = ev.target.value; render(); });
$("#statusf").addEventListener("change", ev => { statusF = ev.target.value; $("#clearall").hidden = !filtersActive(); render(); });
$("#clearall").addEventListener("click", () => {
  q = ""; countySel = ""; statusF = ""; typeF = "all"; hasF = { phone:false, email:false, website:false };
  syncControls(); render();
});

/* Results interactions (event delegation) */
app.addEventListener("click", ev => {
  const countyBtn = ev.target.closest('[data-act="county"]');
  if(countyBtn){
    countySel = countyBtn.dataset.county || "";
    VIEW = "builders";
    syncControls(); render(); window.scrollTo({ top: 0 });
    return;
  }
  const jump = ev.target.closest('[data-act="jump-builder"]');
  if(jump){
    q = jump.dataset.name || "";
    countySel = ""; typeF = "all"; VIEW = "builders";
    syncControls(); render(); window.scrollTo({ top: 0 });
    return;
  }
  const cardEl = ev.target.closest(".card[data-id]");
  if(!cardEl) return;
  const id = cardEl.dataset.id;
  const toggle = ev.target.closest('[data-act="toggle-permits"]');
  if(toggle){
    const open = toggle.getAttribute("aria-expanded") === "true";
    if(open){ COLLAPSED.add(id); EXPANDED.delete(id); } else { EXPANDED.add(id); COLLAPSED.delete(id); }
    render();
    return;
  }
  if(ev.target.closest('[data-act="show-all"]')){ SHOWALL.add(id); render(); return; }
  const chip = ev.target.closest(".chip");
  if(chip){
    cardEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c===chip));
    const notes = cardEl.querySelector(".notes");
    saveLocal(id, chip.dataset.st, notes ? notes.value : "");
  }
});
app.addEventListener("change", ev => {
  const notes = ev.target.closest(".notes");
  if(!notes) return;
  const cardEl = notes.closest(".card[data-id]");
  if(!cardEl) return;
  const on = cardEl.querySelector(".chip.on");
  saveLocal(cardEl.dataset.id, on ? on.dataset.st : "New", notes.value);
});

load();
</script>
</body>
</html>
