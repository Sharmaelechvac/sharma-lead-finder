<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharma Lead Finder</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root {
    --navy: #071828;
    --navy-2: #0c2c4c;
    --navy-3: #123a62;
    --ink: #10233a;
    --blue: #1d6bc4;
    --blue-2: #2b7de9;
    --blue-soft: #e8f1fb;
    --bg: #e8eef5;
    --card: #fff;
    --muted: #5b7088;
    --line: #d5e0ea;
    --ok: #1a7f4c;
    --warn: #9a6b00;
    --bad: #8a3b3b;
    --soon: #5b7088;
    --gold: #d4a017;
    --gold-2: #f5c84c;
    --shadow: 0 10px 30px -18px rgba(7,24,40,.45), 0 1px 3px rgba(7,24,40,.06);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    background:
      radial-gradient(900px 280px at 85% -10%, rgba(43,125,233,.28), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: calc(18px + var(--safe-t)) 20px 48px;
    box-shadow: 0 8px 24px rgba(7,24,40,.28);
  }
  .head { max-width: 1180px; margin: 0 auto; display: flex; gap: 18px; align-items: center; }
  .head img {
    height: 56px; width: auto; max-width: min(280px, 70vw);
    object-fit: contain; object-position: left center;
    background: #fff; border-radius: 12px; padding: 8px 12px;
    display: block; flex: 0 0 auto;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .head h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.02em; font-weight: 800; }
  .head p { margin: 4px 0 0; font-size: .86rem; color: #c9d8ea; line-height: 1.35; }
  @media (max-width: 560px) {
    .head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .head img { height: 48px; max-width: min(260px, 86vw); padding: 6px 10px; }
    .head h1 { font-size: 1.28rem; }
  }
  .stats {
    max-width: 1180px; margin: -32px auto 0; padding: 0 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    position: relative; z-index: 3;
  }
  @media (min-width: 860px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat-tile {
    background: var(--card); border-radius: 16px; padding: 14px 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.7);
    min-height: 86px;
  }
  .stat-tile .k {
    font-size: .68rem; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .stat-tile .n {
    display: block; font-size: 1.45rem; font-weight: 800;
    color: var(--navy-2); margin-top: 6px; letter-spacing: -.03em; line-height: 1.15;
  }
  .stat-tile .n.small { font-size: .98rem; font-weight: 700; letter-spacing: 0; }
  nav {
    max-width: 1180px; margin: 0 auto; display: flex; gap: 8px;
    padding: 16px 16px 0; flex-wrap: wrap;
  }
  nav button, .btn {
    border: 0; background: #fff; color: var(--navy-2); font-weight: 700;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(16,40,70,.08); font-size: .92rem;
    min-height: 44px; transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  nav button.active { background: var(--blue); color: #fff; box-shadow: 0 6px 16px -8px rgba(29,107,196,.8); }
  @media (hover:hover) {
    nav button:hover { transform: translateY(-1px); }
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 10px 16px calc(40px + var(--safe-b)); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 14px; }
  .toolbar input, .toolbar select {
    flex: 1 1 160px; min-height: 44px; border: 1px solid var(--line);
    border-radius: 12px; padding: 0 12px; font-size: 1rem; background: #fff; color: var(--ink);
  }
  .meta { color: var(--muted); font-size: .88rem; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    position: relative; overflow: hidden;
    background: var(--card); border-radius: 18px; padding: 18px 18px 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(16,40,70,.06);
    animation: rise .35s ease both;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:nth-child(1){animation-delay:.02s} .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.08s} .card:nth-child(4){animation-delay:.11s}
  .card:nth-child(5){animation-delay:.14s} .card:nth-child(6){animation-delay:.17s}
  @media (hover:hover) {
    .card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -20px rgba(7,24,40,.5), 0 2px 8px rgba(7,24,40,.06); }
  }
  .card h2 { margin: 0 8px 0 0; font-size: 1.08rem; letter-spacing: -.01em; }
  .card.hot {
    border-color: #f0c14b;
    background: linear-gradient(180deg, #fffaf0 0%, #fff 42%);
    box-shadow: 0 12px 28px -16px rgba(180,120,0,.35), 0 1px 3px rgba(16,40,70,.06);
  }
  .card.hot::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold));
    border-radius: 18px 0 0 18px;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .badge {
    font-size: .7rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; background: var(--blue-soft); color: var(--blue);
  }
  .badge.low { background: #fff3cd; color: #8a6500; }
  .badge.prod { background: #eee8ff; color: #5b3db8; }
  .badge.hot { background: #fff1c2; color: #8a5a00; }
  .stat { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px; font-size: .95rem; }
  .stat b { font-variant-numeric: tabular-nums; }
  .addrs { margin: 0; padding: 0 0 0 18px; color: var(--muted); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 10px; }
  .act {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
    padding: 0 12px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: .88rem;
    border: 1px solid var(--line); background: #f7fafc; color: var(--navy-2);
    transition: background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .act svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .act.call { background: #e8f8ef; border-color: #bfe8d1; color: #14663c; }
  .act.map { background: var(--blue-soft); border-color: #c9def5; color: var(--blue); }
  @media (hover:hover) {
    .act:hover { transform: translateY(-1px); }
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .chip {
    border: 1px solid var(--line); background: #f7fafc; color: var(--muted);
    font: 700 .75rem/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .02em;
    padding: 8px 10px; border-radius: 999px; cursor: pointer; min-height: 36px;
    transition: background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .chip.on { background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
  .chip.on.New { background: var(--blue); border-color: var(--blue); }
  .chip.on.Called { background: #155e8a; border-color: #155e8a; }
  .chip.on.Interested { background: var(--ok); border-color: var(--ok); }
  .chip.on.Won { background: #0f6b3c; border-color: #0f6b3c; }
  .chip[data-st="Not interested"].on, .chip.on.Not { background: #6b7280; border-color: #6b7280; }
  .notes {
    width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font: inherit; color: var(--ink); background: #fbfcfe; resize: vertical;
  }
  .empty {
    background: #fff; border-radius: 18px; padding: 32px 18px; text-align: center;
    color: var(--muted); box-shadow: var(--shadow);
  }
  .band {
    margin: 18px 0 8px; font-size: .72rem; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .county-list { display: flex; flex-direction: column; gap: 10px; }
  .county-row {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: start;
    background: #fff; border-radius: 16px; padding: 14px 14px;
    box-shadow: var(--shadow); border: 1px solid rgba(16,40,70,.05);
    animation: rise .35s ease both;
  }
  @media (max-width: 620px) {
    .county-row { grid-template-columns: 64px 1fr; }
    .county-row .cright { grid-column: 2; }
  }
  .dist {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #e8eef6; color: var(--navy-2); font-weight: 800;
  }
  .dist b { font-size: 1.15rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .dist span { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
  .dist.d0 { background: #0c2c4c; color: #fff; }
  .dist.d1 { background: #1d6bc4; color: #fff; }
  .dist.d2 { background: #3d6f99; color: #fff; }
  .dist.d3 { background: #fff1c2; color: #8a5a00; }
  .cinfo h3 { margin: 0 0 2px; font-size: 1rem; }
  .hint { color: var(--muted); font-size: .82rem; }
  .hint a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .cright { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 800; padding: 4px 8px; border-radius: 999px; }
  .pill.live { background: #d9f3e5; color: var(--ok); }
  .pill.coming_soon { background: #eef2f5; color: var(--soon); }
  .pill.needs_browser { background: #fff3cd; color: var(--warn); }
  .pill.failed { background: #fde8e8; color: var(--bad); }
  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 8px 16px calc(28px + var(--safe-b)); }
  .err { background: #fde8e8; color: var(--bad); padding: 10px 12px; border-radius: 10px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .card, .county-row, nav button, .act, .chip { animation: none; transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <img src="logo.png" alt="Sharma Electric &amp; HVAC" onerror="this.style.display='none'">
    <div>
      <h1>Sharma Lead Finder</h1>
      <p>Private &amp; custom builders pulling new-home permits</p>
    </div>
  </div>
</header>
<div class="stats" id="stats" hidden></div>
<nav>
  <button type="button" data-tab="custom" class="active">Custom builders</button>
  <button type="button" data-tab="production">Production</button>
  <button type="button" data-tab="counties">Counties</button>
</nav>
<div class="wrap" id="app"><p class="meta">Loading…</p></div>
<footer>Sharma Electric &amp; HVAC · Lic. EC13013924 · CAC1823596</footer>
<script>
const STATUSES = ["New","Called","Interested","Not interested","Won"];
const HOT_MIN = 8;
const MILES_BASIS = "Distances are statute miles from downtown Orlando (28.5383°N, 81.3792°W) to each county seat. City of Orlando is 0.";
let DATA = null;
let TAB = "custom";
let q = "", county = "", status = "";

const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const statsEl = $("#stats");

document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b===btn));
    TAB = btn.dataset.tab;
    render();
  });
});

function esc(s){
  return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if(!d) return "—";
  const [y,m,day] = String(d).split("-");
  if(!day) return esc(d);
  return `${m}/${day}/${y}`;
}
function fmtEt(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return esc(String(iso));
  const s = d.toLocaleString("en-US", {
    timeZone: "America/New_York",
    month: "numeric",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  });
  return s + " ET";
}
function telHref(phone){
  const d = String(phone||"").replace(/[^\d+]/g,"");
  return d ? "tel:" + d : "";
}
function mapHref(addr){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
}
function iconPhone(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
}
function iconMap(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
}
function iconWeb(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>';
}

async function load(){
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if(!r.ok) throw new Error("HTTP "+r.status);
    DATA = await r.json();
    // Status/notes edits are kept on this device (static host has no write API).
    try {
      const saved = JSON.parse(localStorage.getItem("lead-status") || "{}");
      (DATA.builders||[]).forEach(b => {
        if(saved[b.id]){ b.status = saved[b.id].status || b.status; b.notes = saved[b.id].notes ?? b.notes; }
      });
    } catch(e){}
    render();
  } catch(e){
    app.innerHTML = '<p class="err">Could not load leads. '+esc(e.message)+'</p>';
  }
}

function tabBuilders(){
  return (DATA.builders||[]).filter(b => TAB==="production" ? b.production : !b.production);
}
function filtered(){
  return tabBuilders().filter(b => {
    if(county && !(b.counties||[]).includes(county)) return false;
    if(status && b.status !== status) return false;
    if(q){
      const hay = (b.name+" "+(b.counties||[]).join(" ")+" "+(b.addresses||[]).join(" ")+" "+(b.phone||"")).toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  });
}
function countyOptions(){
  const names = (DATA.counties||[]).map(c => c.name).filter(Boolean);
  return [...new Set(names)].sort((a,b)=>a.localeCompare(b));
}
function liveCountyCount(){
  return (DATA.counties||[]).filter(c => c.status==="live").length;
}

function renderStats(){
  if(!DATA){ statsEl.hidden = true; return; }
  const builders = TAB==="counties"
    ? ((DATA.stats && (DATA.stats.custom+DATA.stats.production)) || (DATA.builders||[]).length)
    : tabBuilders().length;
  const permits = (DATA.stats && DATA.stats.permits) || 0;
  const live = liveCountyCount();
  const when = fmtEt(DATA.fetchedAt);
  const builderLabel = TAB==="production" ? "Production" : TAB==="counties" ? "Builders" : "Custom";
  statsEl.hidden = false;
  statsEl.innerHTML = `
    <div class="stat-tile"><span class="k">${esc(builderLabel)}</span><span class="n">${builders}</span></div>
    <div class="stat-tile"><span class="k">Permits</span><span class="n">${permits}</span></div>
    <div class="stat-tile"><span class="k">Live counties</span><span class="n">${live}</span></div>
    <div class="stat-tile"><span class="k">Last scan</span><span class="n small">${esc(when)}</span></div>`;
}

function toolbar(count){
  const counties = countyOptions().map(c => `<option ${c===county?"selected":""}>${esc(c)}</option>`).join("");
  const sts = STATUSES.map(s => `<option ${s===status?"selected":""}>${esc(s)}</option>`).join("");
  return `<div class="toolbar">
      <input id="q" type="search" placeholder="Search builder, address, phone" value="${esc(q)}">
      <select id="county"><option value="">All areas</option>${counties}</select>
      <select id="status"><option value="">All statuses</option>${sts}</select>
    </div>
    <p class="meta">${count} builder${count===1?"":"s"} shown · ${(DATA.liveSources||[]).join(", ")||"no live sources"}</p>`;
}

function bindToolbar(){
  const qi=$("#q"), ci=$("#county"), si=$("#status");
  if(!qi) return;
  const go=()=>{ q=qi.value; county=ci.value; status=si.value; render(); };
  qi.addEventListener("input", ev => { q=ev.target.value; renderKeepFocus(); });
  if(ci) ci.addEventListener("change", go);
  if(si) si.addEventListener("change", go);
}

function renderKeepFocus(){
  const start = $("#q") && document.activeElement===$("#q") ? $("#q").selectionStart : null;
  render();
  const qi=$("#q");
  if(qi && start!=null){ qi.focus(); qi.setSelectionRange(start,start); }
}

function card(b){
  const hot = (b.permitCount||0) >= HOT_MIN;
  const badges = (b.counties||[]).map(c=>`<span class="badge">${esc(c)}</span>`).join("")
    + (hot?`<span class="badge hot">Hot lead</span>`:"")
    + (b.lowPriority?`<span class="badge low">Low priority</span>`:"")
    + (b.production?`<span class="badge prod">Production</span>`:"");
  const addrs = (b.addresses||[]).slice(0,4).map(a=>`<li>${esc(a)}</li>`).join("") || "<li>—</li>";
  const acts = [];
  if(b.phone && telHref(b.phone)){
    acts.push(`<a class="act call" href="${esc(telHref(b.phone))}">${iconPhone()} ${esc(b.phone)}</a>`);
  }
  if(b.addresses && b.addresses[0]){
    acts.push(`<a class="act map" href="${esc(mapHref(b.addresses[0]))}" target="_blank" rel="noopener">${iconMap()} Map</a>`);
  }
  if(b.website){
    acts.push(`<a class="act map" href="${esc(b.website)}" target="_blank" rel="noopener">${iconWeb()} Website</a>`);
  }
  if(b.email){
    acts.push(`<a class="act map" href="mailto:${esc(b.email)}">${esc(b.email)}</a>`);
  }
  const contact = b.contactName ? `<div class="stat"><span>Contact: <b>${esc(b.contactName)}</b>${b.contactTitle?` — ${esc(b.contactTitle)}`:""}</span></div>` : "";
  const chips = STATUSES.map(s=>{
    const cls = s==="Not interested" ? "chip" : "chip "+s.replace(/\s+/g,"");
    return `<button type="button" class="${cls}${s===b.status?" on":""}" data-st="${esc(s)}">${esc(s)}</button>`;
  }).join("");
  return `<article class="card${hot?" hot":""}" data-id="${esc(b.id)}">
    <h2>${esc(b.name)}</h2>
    <div class="badges">${badges}</div>
    <div class="stat"><span><b>${b.permitCount}</b> recent permit${b.permitCount===1?"":"s"}</span>
      <span>Latest ${fmtDate(b.latestDate)}</span></div>
    <ul class="addrs">${addrs}</ul>
    ${contact}
    ${acts.length?`<div class="actions">${acts.join("")}</div>`:""}
    <div class="chips">${chips}</div>
    <textarea class="notes" placeholder="Notes">${esc(b.notes||"")}</textarea>
  </article>`;
}

function bindCards(){
  document.querySelectorAll(".card[data-id]").forEach(el => {
    const id = el.dataset.id;
    const notes = el.querySelector(".notes");
    const chips = [...el.querySelectorAll(".chip")];
    const save = async (nextStatus, nextNotes) => {
      const b = (DATA.builders||[]).find(x=>x.id===id);
      if(b){ b.status=nextStatus; b.notes=nextNotes; }
      try {
        const saved = JSON.parse(localStorage.getItem("lead-status") || "{}");
        saved[id] = { status: nextStatus, notes: nextNotes };
        localStorage.setItem("lead-status", JSON.stringify(saved));
      } catch(e){}
    };
    chips.forEach(ch => ch.addEventListener("click", () => {
      chips.forEach(c => c.classList.toggle("on", c===ch));
      save(ch.dataset.st, notes.value);
    }));
    notes.addEventListener("blur", () => {
      const on = chips.find(c => c.classList.contains("on"));
      save(on ? on.dataset.st : "New", notes.value);
    });
  });
}

function distClass(m){
  if(m==null) return "d2";
  if(m <= 50) return "d0";
  if(m <= 100) return "d1";
  if(m <= 150) return "d2";
  return "d3";
}
function bandLabel(m){
  if(m==null) return "Other";
  if(m <= 50) return "Within 50 miles";
  if(m <= 100) return "50–100 miles";
  if(m <= 150) return "100–150 miles";
  return "Always included (beyond 150 miles)";
}
function pills(s){
  const label = s==="needs_browser" ? "Needs browser" : s==="coming_soon" ? "Coming soon" : s==="failed" ? "Failed last run" : s==="live" ? "Live" : s;
  return `<span class="pill ${esc(s)}">${esc(label)}</span>`;
}

function renderCounties(){
  const rows = (DATA.counties||[]).slice().sort((a,b)=>{
    const ma = a.miles ?? 9999, mb = b.miles ?? 9999;
    if(ma !== mb) return ma - mb;
    if(a.kind==="city" && b.kind!=="city") return -1;
    if(b.kind==="city" && a.kind!=="city") return 1;
    return a.name.localeCompare(b.name);
  }).filter(c => {
    if(q && !((c.name+" "+(c.vendor||"")+" "+(c.status||"")+" "+(c.seat||"")).toLowerCase().includes(q.toLowerCase()))) return false;
    if(status && c.status !== status && c.configuredStatus !== status) return false;
    return true;
  });

  const groups = [];
  for(const c of rows){
    const label = bandLabel(c.miles);
    if(!groups.length || groups[groups.length-1].label !== label) groups.push({label, rows:[]});
    groups[groups.length-1].rows.push(c);
  }

  const body = groups.map(g => {
    const items = g.rows.map(c => {
      const mi = c.miles==null ? "—" : String(c.miles);
      const seat = c.seat ? `Seat: ${esc(c.seat)}` : "";
      const vendor = c.portal
        ? `<a href="${esc(c.portal)}" target="_blank" rel="noopener">${esc(c.vendor||"Open portal")}</a>`
        : esc(c.vendor||"");
      const bits = [seat, vendor, c.lastScan ? "Last scan "+fmtEt(c.lastScan) : "", (c.records? c.records+" record"+(c.records===1?"":"s"):""), c.lastSuccessAt && c.status!=="live" ? "Last success "+fmtEt(c.lastSuccessAt) : ""].filter(Boolean);
      return `<article class="county-row">
        <div class="dist ${distClass(c.miles)}"><b>${esc(mi)}</b><span>mi</span></div>
        <div class="cinfo">
          <h3>${esc(c.name)}</h3>
          <div class="hint">${bits.join(" · ")}${c.alwaysInclude?' · Always included':''}</div>
          ${c.notes?`<div class="hint">${esc(c.notes)}</div>`:""}
          ${c.error?`<div class="hint" style="color:var(--bad)">Last run error: ${esc(c.error)}</div>`:""}
        </div>
        <div class="cright">${pills(c.status||c.configuredStatus)}</div>
      </article>`;
    }).join("");
    return `<div class="band">${esc(g.label)}</div><div class="county-list">${items}</div>`;
  }).join("") || '<div class="empty">No counties match these filters.</div>';

  app.innerHTML = `<div class="toolbar">
      <input id="q" type="search" placeholder="Search counties or vendors" value="${esc(q)}">
      <select id="status">
        <option value="">All statuses</option>
        <option ${status==="live"?"selected":""} value="live">Live</option>
        <option ${status==="needs_browser"?"selected":""} value="needs_browser">Needs browser</option>
        <option ${status==="coming_soon"?"selected":""} value="coming_soon">Coming soon</option>
        <option ${status==="failed"?"selected":""} value="failed">Failed last run</option>
      </select>
    </div>
    <p class="meta">${rows.length} area${rows.length===1?"":"s"} · Last run ${fmtEt(DATA.fetchedAt)} · ${liveCountyCount()} live · Florida counties within 150 miles of Orlando, plus Lee and Charlotte. ${esc(MILES_BASIS)}</p>
    ${body}`;
  const qi=$("#q"), si=$("#status");
  qi.addEventListener("input", ev => { q=ev.target.value; renderKeepFocus(); });
  si.addEventListener("change", ev => { status=ev.target.value; render(); });
}

function render(){
  if(!DATA){ app.innerHTML='<p class="meta">Loading…</p>'; return; }
  renderStats();
  if(TAB==="counties"){ renderCounties(); return; }
  const list = filtered();
  if(!list.length){
    app.innerHTML = toolbar(0)+'<div class="empty">No builders match these filters. Counties without a live feed are listed under Counties.</div>';
    bindToolbar();
    return;
  }
  app.innerHTML = toolbar(list.length)+`<div class="grid">${list.map(card).join("")}</div>`;
  bindToolbar();
  bindCards();
}

load();
</script>
</body>
</html>
